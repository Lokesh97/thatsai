<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lokesh Ratusaria — thatsAI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #e8e8e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        line-height: 1.6;
      }
      .container {
        max-width: 640px;
        text-align: center;
      }
      .photo {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #2a2a2a;
        margin: 0 auto 1.5rem;
        display: block;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;  
        background: linear-gradient(90deg, #fff, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .role {
        color: #a855f7;
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }
      .bio {
        color: #b8b8b8;
        font-size: 1.05rem;
        margin-bottom: 2rem;
      }
      .tagline {
        font-size: 1.25rem;
        color: #fff;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid #222;
      }
      .pulse { 
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #a855f7;
        border-radius: 50%;
        margin-right: 8px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }
      .links {
        margin-top: 2rem;
        display: flex;
        gap: 1.5rem;
        justify-content: center;
      }
      .links a {
        color: #888;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s;
      }
      .links a:hover { color: #a855f7; }
    </style>
  </head>
  <body>    
    <div class="container">
      <img src="photo.png" alt="Lokesh Ratusaria" class="photo" />
      <h1>Lokesh Ratusaria</h1>
      <p class="role">Senior Backend Engineer</p>
      <p class="bio">
        I build large-scale distributed systems — real-time analytics on Kafka + Pinot,
        backend services, and now diving deep into agentic AI.
      </p>
      <div class="tagline">
        <span class="pulse"></span>
        Cool AI projects coming soon.
      </div>
      <div class="links">
        <a href="mailto:lokeshr@thatsai.in">Email</a>
        <a href="https://github.com/Lokesh97" target="_blank">GitHub</a>
        <a href="https://www.linkedin.com/in/lokesh-r-373656133/" target="_blank">LinkedIn</a>
      </div>
    </div>
  </body>   
  </html>
